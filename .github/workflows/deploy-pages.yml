name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/3d-scrolling-website-s09aix"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # The Tapfiliate webhook (api/) runs on Vercel, not Pages — keep its
      # source and the server-side tooling out of the published static site.
      - name: Exclude server-side files from the static artifact
        run: rm -rf api test docs vercel.json package.json .env.example
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
