# Render Blueprint: puts the real app online from this GitHub repository.
#
#   Render dashboard > New > Blueprint > choose this repository > Apply.
#   Render asks for SITE_PASSWORD (the password the whole site will ask for).
#
# This is the STAGING copy: the demo company with the demo sign-in picker, every outside
# service simulated, and a site password in front. For the real company, see docs/GO_LIVE.md
# (APP_ENV=production, no demo data, `npm run setup:production`).
databases:
  - name: aactivated-db
    databaseName: aactivated
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: aactivated-ai-brain
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:hosted
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: aactivated-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: APP_ENV
        value: staging
      - key: DEMO_LOGIN_ENABLED
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: AI_PROVIDER
        value: mock
      - key: EMAIL_TRANSPORT
        value: console
      - key: AGENT_EXECUTION
        value: inline
      - key: SITE_PASSWORD
        sync: false
